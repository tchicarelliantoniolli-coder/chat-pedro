<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Chat Pedro</title>
<style>
  /* janelinha de abertura (como a "Verificando atualizacoes" do Discord) */
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    background: #121214; color: #dfdfe2; -webkit-app-region: drag;
    font-family: "gg sans", "Noto Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .logo { width: 104px; height: 104px; animation: bob 1.6s cubic-bezier(.45, 0, .55, 1) infinite; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .shadow { width: 64px; height: 8px; border-radius: 50%; background: rgba(0, 0, 0, .45); margin-top: 10px; animation: shadow 1.6s cubic-bezier(.45, 0, .55, 1) infinite; }
  .bubble { transform-origin: 32px 30px; animation: talk 1.6s ease-in-out infinite; }
  .dot { animation: dot 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  #title { margin-top: 26px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: #fbfbfb; text-align: center; padding: 0 20px; }
  #sub { margin-top: 8px; min-height: 32px; font-size: 13px; font-weight: 500; color: #96979e; text-align: center; padding: 0 28px; line-height: 16px; }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9 } 50% { transform: scaleX(.75); opacity: .5 } }
  @keyframes talk { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
  @keyframes dot { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .logo, .shadow, .bubble, .dot { animation: none } }
</style>
</head>
<body>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <rect width="64" height="64" rx="18" fill="#5865f2"/>
      <g class="bubble">
        <path d="M14 17a5 5 0 0 1 5-5h26a5 5 0 0 1 5 5v18a5 5 0 0 1-5 5H29l-10 8v-8a5 5 0 0 1-5-5z" fill="#fff"/>
        <g fill="#5865f2"><circle class="dot" cx="23" cy="26" r="3"/><circle class="dot" cx="32" cy="26" r="3"/><circle class="dot" cx="41" cy="26" r="3"/></g>
      </g>
    </svg>
  </div>
  <div class="shadow" aria-hidden="true"></div>
  <div id="title" role="status">Iniciando...</div>
  <div id="sub"></div>
<script>
  window.setStatus = (t, s) => { document.getElementById("title").textContent = t; document.getElementById("sub").textContent = s || ""; };
</script>
</body>
</html>
