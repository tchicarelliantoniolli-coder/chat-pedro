# Monta o instalador do Chat Pedro para Windows num Windows de verdade e publica na pagina de versoes do projeto.
# Como usar: aba "Actions" do GitHub > "App do Windows" > botao "Run workflow".
# Antes de rodar de novo, suba a "version" em desktop/package.json (o programa instalado procura versao maior).
name: App do Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-windows
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Instalar o que o programa usa
        working-directory: desktop
        run: npm ci
      - name: Montar o instalador
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publicar a versao (cria ou substitui os arquivos)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          TAG="app-v$V"
          cd desktop/dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ChatPedroSetup.exe ChatPedroSetup.exe.blockmap latest.yml --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" ChatPedroSetup.exe ChatPedroSetup.exe.blockmap latest.yml --target "$GITHUB_SHA" --title "Chat Pedro $V" --notes "Instalador do Chat Pedro para Windows." --latest
          fi
