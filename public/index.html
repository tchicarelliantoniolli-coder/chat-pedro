<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Pedro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root {
  --bg: #000000;
  --fg: #33ff66;
  --dim: #1f9940;
  --bright: #b6ffc8;
  --err: #ff5555;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --mono: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 22px; line-height: 1.2;
  display: flex; flex-direction: column;
}
.wrap {
  width: 100%; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header .wrap { padding-block: 12px 4px; }
h1 { font-family: var(--pixel); font-size: 14px; font-weight: 400; margin: 0; color: var(--bright); }
.sub { color: var(--dim); margin-top: 6px; overflow-wrap: anywhere; }
main { flex: 1; overflow-y: auto; min-height: 0; }
#log { padding-block: 8px; }
.line { white-space: pre-wrap; overflow-wrap: anywhere; }
.time { color: var(--dim); }
.who { color: var(--bright); }
.sys { color: var(--dim); }
footer .wrap { padding-block: 6px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
form { display: flex; align-items: flex-start; }
.ps1 { color: var(--bright); white-space: pre; }
textarea {
  flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent;
  color: var(--fg); font: inherit; caret-color: var(--fg); padding: 0; margin: 0; max-height: 6em;
}
textarea::placeholder { color: var(--dim); }
#note { color: var(--dim); min-height: 1.2em; margin: 4px 0 0; }
#photoBtn {
  all: unset; cursor: pointer; color: var(--bright); white-space: pre; margin-left: 8px;
}
#photoBtn:hover, #photoBtn:focus-visible { color: var(--bg); background: var(--fg); }
.pic { display: block; margin: 4px 0 6px; }
.pic img {
  display: block; max-width: min(280px, 100%); max-height: 320px; border: 2px solid var(--dim);
  cursor: zoom-in; background: #111;
}
.pic img:hover { border-color: var(--fg); }
#viewer {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); display: flex; align-items: center;
  justify-content: center; z-index: 20; cursor: zoom-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#viewer img { max-width: 100%; max-height: 100%; border: 2px solid var(--fg); }
body.dragging main { outline: 2px dashed var(--fg); outline-offset: -8px; }
#note.err { color: var(--err); }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>CHAT PEDRO</h1>
  <div class="sub" id="status">C:\&gt; conectando...</div>
</div></header>

<main id="scroller"><div class="wrap"><div id="log"></div></div></main>

<footer><div class="wrap">
  <form id="form">
    <span class="ps1" id="ps1">apelido: </span>
    <textarea id="input" rows="1" placeholder="digite seu apelido_" aria-label="Mensagem" maxlength="2000" autofocus></textarea>
    <button type="button" id="photoBtn" title="Enviar foto" hidden>[FOTO]</button>
    <input type="file" id="file" accept="image/*" hidden>
  </form>
  <p id="note">Escolha um apelido e aperte ENTER</p>
</div></footer>

<div id="viewer" hidden><img alt="Foto em tamanho grande"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), scroller = $("scroller"), input = $("input"), note = $("note"), ps1 = $("ps1");
  const socket = io();
  let nick = null, users = [];

  const HELP = "ENTER envia | [FOTO] ou cole/arraste uma imagem | /nick NOVO muda o apelido | /quem lista quem esta online | /limpar limpa a tela";
  const setNote = (text, err) => { note.textContent = text; note.classList.toggle("err", !!err); };
  const pad = (n) => String(n).padStart(2, "0");
  const fmtTime = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const span = (cls, text) => { const s = document.createElement("span"); s.className = cls; s.textContent = text; return s; };
  const saved = (() => { try { return localStorage.getItem("chatpedro-nick"); } catch { return null; } })();

  function addLine(m) {
    const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
    const empty = $("empty");
    if (empty) empty.remove();
    const l = document.createElement("div");
    l.className = "line";
    l.append(span("time", "[" + fmtTime(m.ts) + "] "));
    if (m.type === "sys") l.append(span("sys", "*** " + m.text));
    else if (m.type === "img") {
      const box = document.createElement("span");
      box.className = "pic";
      const img = document.createElement("img");
      img.alt = "Foto de " + m.nick;
      img.src = m.src;
      img.addEventListener("load", () => { if (atBottom) scroller.scrollTop = scroller.scrollHeight; });
      img.addEventListener("click", () => openViewer(m.src));
      box.append(img);
      l.append(span("who", m.nick + "> "), box);
    }
    else l.append(span("who", m.nick + "> "), document.createTextNode(m.text));
    log.append(l);
    if (atBottom) scroller.scrollTop = scroller.scrollHeight;
  }
  const localSys = (text) => addLine({ type: "sys", text, ts: Date.now() });

  function updateStatus() {
    $("status").textContent = socket.connected
      ? "C:\\> online | " + users.length + " na sala" + (nick ? " | voce: " + nick : "")
      : "C:\\> desconectado... tentando reconectar";
  }

  function join(name) {
    socket.emit("join", name, (res) => {
      if (!res.ok) { setNote("ERRO: " + res.error, true); return; }
      nick = res.nick;
      try { localStorage.setItem("chatpedro-nick", nick); } catch {}
      ps1.textContent = nick + "> ";
      $("photoBtn").hidden = false;
      input.placeholder = "digite aqui_";
      setNote(HELP);
      updateStatus();
    });
  }

  function submit() {
    const text = input.value.trim();
    if (!text) return;
    if (!socket.connected) { setNote("ERRO: sem conexao. Espere reconectar.", true); return; }
    input.value = ""; autosize();
    if (!nick) return join(text);
    if (text.startsWith("/nick ")) return join(text.slice(6));
    if (text === "/quem") return localSys("online: " + users.join(", "));
    if (text === "/limpar") { log.replaceChildren(); return; }
    socket.emit("message", text);
  }

  socket.on("connect", () => { updateStatus(); if (nick) join(nick); else if (saved) join(saved); });
  socket.on("disconnect", updateStatus);
  socket.on("history", (msgs) => {
    log.replaceChildren();
    msgs.forEach(addLine);
    if (!msgs.length) {
      const e = span("line sys", "Nenhuma mensagem ainda. Seja o primeiro!");
      e.id = "empty"; e.style.display = "block";
      log.append(e);
    }
    scroller.scrollTop = scroller.scrollHeight;
  });
  socket.on("message", addLine);
  socket.on("users", (list) => { users = list; updateStatus(); });

  // Fotos: reduz para no maximo 1280px e converte para JPEG antes de enviar.
  // GIFs pequenos vao como estao para manter a animacao.
  const MAX_SIDE = 1280, MAX_BYTES = 3 * 1024 * 1024;
  const readAsDataURL = (file) => new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(file);
  });
  const loadImage = (src) => new Promise((ok, fail) => {
    const img = new Image(); img.onload = () => ok(img); img.onerror = fail; img.src = src;
  });

  async function prepareImage(file) {
    const raw = await readAsDataURL(file);
    if (file.type === "image/gif" && raw.length < MAX_BYTES) return raw;
    const img = await loadImage(raw);
    const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); // fundo para PNG transparente
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    for (const q of [0.82, 0.7, 0.55, 0.4]) {
      const out = canvas.toDataURL("image/jpeg", q);
      if (out.length < MAX_BYTES) return out;
    }
    throw new Error("grande demais");
  }

  async function sendImage(file) {
    if (!file || !file.type.startsWith("image/")) { setNote("ERRO: isso nao e uma imagem.", true); return; }
    if (!nick) { setNote("Escolha um apelido antes de mandar foto.", true); return; }
    if (!socket.connected) { setNote("ERRO: sem conexao. Espere reconectar.", true); return; }
    setNote("enviando foto...");
    try {
      const data = await prepareImage(file);
      socket.emit("image", data);
      setNote(HELP);
    } catch {
      setNote("ERRO: nao deu para enviar essa foto. Tente outra.", true);
    }
  }

  $("photoBtn").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", (e) => { sendImage(e.target.files[0]); e.target.value = ""; });
  input.addEventListener("paste", (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
    if (item) { e.preventDefault(); sendImage(item.getAsFile()); }
  });
  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
  document.addEventListener("drop", (e) => {
    e.preventDefault(); document.body.classList.remove("dragging");
    const file = [...(e.dataTransfer?.files || [])].find((f) => f.type.startsWith("image/"));
    if (file) sendImage(file);
  });

  const viewer = $("viewer");
  function openViewer(src) { viewer.querySelector("img").src = src; viewer.hidden = false; }
  viewer.addEventListener("click", () => { viewer.hidden = true; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") viewer.hidden = true; });

  function autosize() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  $("form").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  scroller.addEventListener("click", () => { if (!window.getSelection().toString()) input.focus(); });
})();
</script>
</body>
</html>
